<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BINWATCH | Smart Trash Monitor</title>

<style>

:root {
  --bg: #0b120f;
  --panel: #121b17;
  --panel2: #17221c;
  --border: #26372e;
  --text: #eaf3ec;
  --muted: #82988c;

  --green: #35d488;
  --low: #9fdb5c;
  --yellow: #f0b429;
  --orange: #ff7a3c;
  --red: #ff4757;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 950px;
  margin: auto;
}

/* HEADER */

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.small-title {
  color: var(--green);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 7px;
}

h1 {
  font-size: 38px;
}

h1 span {
  color: var(--orange);
}

.system-box {
  text-align: right;
}

.system-label {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 4px;
}

#system-status {
  font-size: 18px;
  font-weight: bold;
}

.online {
  color: var(--green);
}

.offline {
  color: var(--red);
}

.clock {
  color: var(--muted);
  margin-top: 5px;
}

/* NOTIFICATION BUTTON */

#notificationBtn {
  margin-top: 12px;
  padding: 10px 16px;
  border: 1px solid var(--green);
  border-radius: 8px;
  background: var(--panel);
  color: var(--green);
  cursor: pointer;
  font-weight: bold;
}

#notificationBtn:disabled {
  opacity: 0.6;
  cursor: default;
}

/* FULL ALERT */

#alert {
  display: none;
  margin: 20px 0;
  padding: 15px;
  border: 1px solid var(--red);
  border-radius: 8px;
  color: var(--red);
  background: rgba(255, 71, 87, 0.10);
  font-weight: bold;
  text-align: center;
}

/* BIN CARD */

.bin-card {
  margin: 25px auto 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 4px solid var(--green);
  border-radius: 12px;
  padding: 22px;
  transition: border-color 0.4s;
}

.bin-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.bin-header h2 {
  font-size: 22px;
}

.live {
  font-size: 12px;
  font-weight: bold;
}

/* BIN CONTENT */

.bin-content {
  display: grid;
  grid-template-columns: 80px 160px 1fr;
  gap: 25px;
  align-items: center;
}

/* LEVEL LADDER */

.ladder {
  display: flex;
  flex-direction: column-reverse;
  gap: 5px;
}

.rung {
  height: 32px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 9px;
  color: var(--muted);
}

.rung.active.empty {
  background: var(--green);
  color: #07120d;
}

.rung.active.low {
  background: var(--low);
  color: #07120d;
}

.rung.active.medium {
  background: var(--yellow);
  color: #07120d;
}

.rung.active.high {
  background: var(--orange);
  color: #07120d;
}

.rung.active.full {
  background: var(--red);
  color: white;
}

/* BIN VISUAL */

.bin-visual {
  text-align: center;
}

.bin-lid {
  width: 115px;
  height: 8px;
  margin: auto;
  margin-bottom: 5px;
  background: var(--border);
  border-radius: 5px;
}

.bin {
  width: 100px;
  height: 130px;
  margin: auto;
  position: relative;
  border: 4px solid var(--border);
  border-radius: 5px 5px 15px 15px;
  overflow: hidden;
}

.bin-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 0%;
  background: var(--green);
  transition: height 0.7s, background 0.5s;
}

.percentage {
  margin-top: 12px;
  font-size: 28px;
  font-weight: bold;
}

/* DATA */

.data {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.status {
  display: inline-block;
  width: fit-content;
  padding: 7px 14px;
  border-radius: 20px;
  background: var(--panel2);
  font-weight: bold;
  color: var(--green);
}

.data-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 8px;
  border-bottom: 1px dashed var(--border);
  font-size: 13px;
}

.data-row span {
  color: var(--muted);
}

.data-row strong {
  color: var(--text);
}

/* FIREBASE */

.connection {
  margin-top: 20px;
  padding: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

#firebase-status {
  color: var(--green);
  font-weight: bold;
}

/* FOOTER */

footer {
  text-align: center;
  margin-top: 25px;
  color: var(--muted);
  font-size: 11px;
}

/* MOBILE */

@media(max-width:650px) {

  body {
    padding: 12px;
  }

  h1 {
    font-size: 30px;
  }

  .system-box {
    text-align: left;
  }

  .bin-content {
    grid-template-columns: 55px 100px 1fr;
    gap: 12px;
  }

  .bin {
    width: 75px;
    height: 115px;
  }

  .bin-lid {
    width: 85px;
  }

  .data-row {
    font-size: 11px;
  }
}

@media(max-width:480px) {

  .bin-card {
    padding: 15px;
  }

  .bin-content {
    grid-template-columns: 50px 85px 1fr;
    gap: 10px;
  }

  .bin {
    width: 65px;
    height: 105px;
  }

  .bin-lid {
    width: 75px;
  }

  .data-row {
    flex-direction: column;
    gap: 3px;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <div>

<div class="small-title">
  FACILITY IoT · ESP32
</div>

<h1>
  BIN<span>WATCH</span>
</h1>

  </div>

  <div class="system-box">

<div class="system-label">
  ESP32 STATUS
</div>

<div
  id="system-status"
  class="offline">

  OFFLINE

</div>

<div
  id="clock"
  class="clock">

  --:--:--

</div>

<button
  id="notificationBtn"
  onclick="enableNotifications()">

  Enable Notifications

</button>

  </div>

</header>

<!-- =====================================================
     FULL ALERT
===================================================== -->

<div id="alert">

🚨 TRASH BIN FULL

  <br>

Floor 1 bin needs to be emptied.

</div>

<!-- =====================================================
     BIN CARD
===================================================== -->

<section
  class="bin-card"
  id="binCard">

  <div class="bin-header">

<h2>
  Floor 1
</h2>

<div
  id="live-text"
  class="live offline">

  ● ESP32 OFFLINE

</div>

  </div>

  <div class="bin-content">

<!-- LEVEL LADDER -->

<div class="ladder">

  <div
    class="rung full"
    data-level="full">

    FULL

  </div>

  <div
    class="rung high"
    data-level="high">

    HIGH

  </div>

  <div
    class="rung medium"
    data-level="medium">

    MED

  </div>

  <div
    class="rung low"
    data-level="low">

    LOW

  </div>

  <div
    class="rung empty"
    data-level="empty">

    EMPTY

  </div>

</div>


<!-- BIN -->

<div class="bin-visual">

  <div class="bin-lid"></div>

  <div class="bin">

    <div
      id="bin-fill"
      class="bin-fill">

    </div>

  </div>

  <div class="percentage">

    <span id="percentage">
      0
    </span>%

  </div>

</div>


<!-- DATA -->

<div class="data">

  <div
    id="status"
    class="status">

    WAITING

  </div>


  <div class="data-row">

    <span>
      Distance
    </span>

    <strong id="distance">
      -- cm
    </strong>

  </div>


  <div class="data-row">

    <span>
      Fill Level
    </span>

    <strong id="fill">
      -- %
    </strong>

  </div>


  <div class="data-row">

    <span>
      ESP32
    </span>

    <strong id="esp-status">
      OFFLINE
    </strong>

  </div>


  <div class="data-row">

    <span>
      Last Seen
    </span>

    <strong id="last-seen">
      --
    </strong>

  </div>

</div>

  </div>

</section>

<!-- FIREBASE CONNECTION -->

<div class="connection">

Firebase:

  <span id="firebase-status">
    CONNECTING
  </span>

</div>

<footer>

Firebase Realtime Database · /bin1

</footer>

</div>

<!-- =====================================================
     FIREBASE SDK
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>


// =====================================================
// FIREBASE CONFIG
// =====================================================

const firebaseConfig = {

  apiKey:
    "AIzaSyBYaa4a2dfSPHQ7-j1rkSG-CaA6bv0EV-0",

  databaseURL:
    "https://trashbin-monitor-e8c8c-default-rtdb.asia-southeast1.firebasedatabase.app"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.database();


// =====================================================
// SETTINGS
// =====================================================

// ESP32 sends data every 5 seconds.
// If no new last_seen is received for 15 seconds,
// the ESP32 is considered offline.

const ONLINE_TIMEOUT =
  15000;


// =====================================================
// VARIABLES
// =====================================================

let fullNotificationSent =
  false;

let notificationEnabled =
  false;

let lastSeenValue =
  null;


// =====================================================
// ENABLE NOTIFICATIONS
// =====================================================

async function enableNotifications() {


  if (
    !("Notification" in window)
  ) {

    alert(
      "Your browser does not support notifications."
    );

    return;

  }


  const permission =
    await Notification.requestPermission();


  if (
    permission === "granted"
  ) {

    notificationEnabled =
      true;


    const button =
      document.getElementById(
        "notificationBtn"
      );


    button.textContent =
      "Notifications Enabled";


    button.disabled =
      true;


    new Notification(
      "BINWATCH",
      {

        body:
          "Trash bin notifications are enabled."

      }

    );

  }

}


// =====================================================
// FIREBASE CONNECTION STATUS
// =====================================================

db.ref(".info/connected").on(

  "value",

  function(snapshot) {


    const connected =
      snapshot.val();


    const firebaseStatus =
      document.getElementById(
        "firebase-status"
      );


    if (
      connected === true
    ) {

      firebaseStatus.textContent =
        "CONNECTED";

    }

    else {

      firebaseStatus.textContent =
        "DISCONNECTED";

    }

  }

);


// =====================================================
// LISTEN TO BIN DATA
// =====================================================

db.ref("/bin1").on(

  "value",

  function(snapshot) {


    const data =
      snapshot.val();


    if (
      !data
    ) {

      setESP32Offline();

      return;

    }


    updateBin(
      data
    );

  },

  function(error) {

    console.error(
      "Firebase error:",
      error
    );

  }

);


// =====================================================
// UPDATE BIN
// =====================================================

function updateBin(
  data
) {


  // ===================================================
  // DISTANCE
  // ===================================================

  const distance =
    Number(
      data.distance
    );


  if (
    !isNaN(distance)
  ) {

    document.getElementById(
      "distance"
    ).textContent =
      distance.toFixed(2)
      + " cm";

  }


  // ===================================================
  // PERCENTAGE
  // ===================================================

  let percentage =
    Number(
      data.fillpercentage
    );


  if (
    isNaN(percentage)
  ) {

    percentage = 0;

  }


  percentage =
    Math.max(
      0,
      Math.min(
        100,
        percentage
      )
    );


  document.getElementById(
    "percentage"
  ).textContent =
    Math.round(
      percentage
    );


  document.getElementById(
    "fill"
  ).textContent =
    percentage.toFixed(1)
    + " %";


  // ===================================================
  // STATUS
  // ===================================================

  const status =
    String(
      data.status ||
      "UNKNOWN"
    ).toUpperCase();


  document.getElementById(
    "status"
  ).textContent =
    status;


  // ===================================================
  // SAVE LAST SEEN
  // ===================================================

  lastSeenValue =
    data.last_seen;


  // ===================================================
  // CHECK ESP32
  // ===================================================

  checkESP32Status(
    data.last_seen
  );


  // ===================================================
  // LEVEL
  // ===================================================

  updateLevel(
    percentage
  );


  // ===================================================
  // FULL NOTIFICATION
  // ===================================================

  checkFullNotification(
    percentage,
    status
  );

}


// =====================================================
// ESP32 ONLINE / OFFLINE
// =====================================================

function checkESP32Status(
  lastSeen
) {


  const systemStatus =
    document.getElementById(
      "system-status"
    );


  const liveText =
    document.getElementById(
      "live-text"
    );


  const espStatus =
    document.getElementById(
      "esp-status"
    );


  const lastSeenElement =
    document.getElementById(
      "last-seen"
    );


  // No last_seen value

  if (
    lastSeen === undefined ||
    lastSeen === null ||
    lastSeen === ""
  ) {

    setESP32Offline();

    lastSeenElement.textContent =
      "No data";

    return;

  }


  let timestamp =
    Number(
      lastSeen
    );


  if (
    isNaN(timestamp)
  ) {

    setESP32Offline();

    lastSeenElement.textContent =
      "Invalid";

    return;

  }


  // Firebase server timestamp
  // normally uses milliseconds.

  if (
    timestamp < 10000000000
  ) {

    timestamp *=
      1000;

  }


  const now =
    Date.now();


  const age =
    now - timestamp;


  // ===================================================
  // ONLINE
  // ===================================================

  if (
    age >= 0 &&
    age <= ONLINE_TIMEOUT
  ) {


    systemStatus.textContent =
      "ONLINE";


    systemStatus.className =
      "online";


    liveText.textContent =
      "● ESP32 ONLINE";


    liveText.className =
      "live online";


    espStatus.textContent =
      "ONLINE";


    espStatus.className =
      "online";


  }


  // ===================================================
  // OFFLINE
  // ===================================================

  else {


    setESP32Offline();

  }


  // ===================================================
  // LAST SEEN DISPLAY
  // ===================================================

  const date =
    new Date(
      timestamp
    );


  if (
    !isNaN(
      date.getTime()
    )
  ) {

    lastSeenElement.textContent =
      date.toLocaleTimeString();

  }

}


// =====================================================
// SET OFFLINE
// =====================================================

function setESP32Offline() {


  document.getElementById(
    "system-status"
  ).textContent =
    "OFFLINE";


  document.getElementById(
    "system-status"
  ).className =
    "offline";


  document.getElementById(
    "live-text"
  ).textContent =
    "● ESP32 OFFLINE";


  document.getElementById(
    "live-text"
  ).className =
    "live offline";


  document.getElementById(
    "esp-status"
  ).textContent =
    "OFFLINE";


  document.getElementById(
    "esp-status"
  ).className =
    "offline";

}


// =====================================================
// CHECK LAST_SEEN EVERY SECOND
// =====================================================

setInterval(

  function() {


    if (
      lastSeenValue !== null
    ) {

      checkESP32Status(
        lastSeenValue
      );

    }

  },

  1000

);


// =====================================================
// LEVEL DISPLAY
// =====================================================

function updateLevel(
  percentage
) {


  let level;


  if (
    percentage >= 85
  ) {

    level =
      "full";

  }

  else if (
    percentage >= 65
  ) {

    level =
      "high";

  }

  else if (
    percentage >= 40
  ) {

    level =
      "medium";

  }

  else if (
    percentage >= 20
  ) {

    level =
      "low";

  }

  else {

    level =
      "empty";

  }


  const levels = [

    "empty",
    "low",
    "medium",
    "high",
    "full"

  ];


  const currentIndex =
    levels.indexOf(
      level
    );


  document
    .querySelectorAll(
      ".rung"
    )
    .forEach(
      function(rung) {


        const rungIndex =
          levels.indexOf(
            rung.dataset.level
          );


        rung.classList.toggle(

          "active",

          rungIndex <=
          currentIndex

        );

      }
    );


  // ===================================================
  // BIN COLOR
  // ===================================================

  const bin =
    document.getElementById(
      "bin-fill"
    );


  if (
    level === "full"
  ) {

    bin.style.background =
      "var(--red)";

  }

  else if (
    level === "high"
  ) {

    bin.style.background =
      "var(--orange)";

  }

  else if (
    level === "medium"
  ) {

    bin.style.background =
      "var(--yellow)";

  }

  else if (
    level === "low"
  ) {

    bin.style.background =
      "var(--low)";

  }

  else {

    bin.style.background =
      "var(--green)";

  }


  bin.style.height =
    percentage + "%";


  // ===================================================
  // CARD BORDER
  // ===================================================

  const card =
    document.getElementById(
      "binCard"
    );


  if (
    level === "full"
  ) {

    card.style.borderLeftColor =
      "var(--red)";

  }

  else if (
    level === "high"
  ) {

    card.style.borderLeftColor =
      "var(--orange)";

  }

  else if (
    level === "medium"
  ) {

    card.style.borderLeftColor =
      "var(--yellow)";

  }

  else if (
    level === "low"
  ) {

    card.style.borderLeftColor =
      "var(--low)";

  }

  else {

    card.style.borderLeftColor =
      "var(--green)";

  }

}


// =====================================================
// FULL BIN NOTIFICATION
// =====================================================

function checkFullNotification(
  percentage,
  status
) {


  const isFull =
    percentage >= 85 ||
    status === "FULL";


  const alert =
    document.getElementById(
      "alert"
    );


  if (
    isFull
  ) {


    alert.style.display =
      "block";


    if (
      !fullNotificationSent
    ) {


      fullNotificationSent =
        true;


      if (
        notificationEnabled &&
        Notification.permission ===
        "granted"
      ) {


        new Notification(
          "🚨 Trash Bin Full",
          {

            body:
              "Floor 1 trash bin is full. Please empty the bin."

          }

        );

      }

    }

  }

  else {


    alert.style.display =
      "none";


    fullNotificationSent =
      false;

  }

}


// =====================================================
// CLOCK
// =====================================================

function updateClock() {


  document.getElementById(
    "clock"
  ).textContent =
    new Date()
      .toLocaleTimeString();

}


setInterval(
  updateClock,
  1000
);


updateClock();


// =====================================================
// NOTIFICATION PERMISSION
// =====================================================

if (
  "Notification" in window &&
  Notification.permission ===
  "granted"
) {


  notificationEnabled =
    true;


  const button =
    document.getElementById(
      "notificationBtn"
    );


  button.textContent =
    "Notifications Enabled";


  button.disabled =
    true;

}

</script>

</body>

</html>
